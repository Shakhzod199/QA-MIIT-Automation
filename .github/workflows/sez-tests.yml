name: SEZ Tests

# Non-default test types append " [type]", automated (non-dashboard) triggers
# append " (CI/CD)", and single-test runs append the filter after " — ", so
# the dashboard can tell apart a full frontend suite run from an api/load run,
# a CI/CD-triggered run, or a single-test run. Defaults → just "SEZ Tests".
run-name: SEZ Tests${{ (inputs.type != '' && inputs.type != 'frontend') && format(' [{0}]', inputs.type) || '' }}${{ inputs.triggered_by == 'gitlab-deploy' && ' (CI/CD)' || '' }}${{ inputs.test_filter && format(' — {0}', inputs.test_filter) || '' }}

on:
  # Daily full-suite run. GitHub cron is in UTC; 05:00 UTC = 10:00 Asia/Tashkent
  # (UTC+5, no DST). Scheduled runs only fire from the default branch (main) and
  # pass no test_filter, so the whole suite runs.
  schedule:
    - cron: "0 5 * * *"
  # Manual — runs are also triggered from the dashboard "Run" button
  # (workflow_dispatch).
  workflow_dispatch:
    inputs:
      type:
        description: "Test type to run"
        required: false
        default: "frontend"
        type: choice
        options:
          - frontend
          - api
          - load
      test_filter:
        description: >-
          Optional Playwright filter to run a single test, e.g.
          "tests/sez/columns.spec.ts:24". Empty runs the whole suite.
        required: false
        default: ""
      triggered_by:
        description: >-
          Internal — set to "gitlab-deploy" by the GitLab deploy pipeline's
          automated trigger. Leave as "manual" when running from the dashboard.
        required: false
        default: "manual"
        type: string
      dashboard_user:
        description: >-
          Internal — set automatically by the dashboard's trigger API to the
          username of whoever clicked Run, so the Telegram notification can
          say who ran it. Leave empty when running from the GitHub UI directly.
        required: false
        default: ""
        type: string

env:
  SEZ_BASE_URL: https://testsez2.miit.uz

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: playwright-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-tests/package-lock.json

      - run: npm ci

      # Chromium is ~150 MB and does not change between runs — cache it on the
      # lockfile so only a Playwright version bump pays the download again.
      # Without this every run re-downloaded it, and on a slow runner that
      # consumed the entire job budget: GitHub then reports "Cancelled" with
      # the tests never having run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('playwright-tests/package-lock.json') }}

      # Deliberately NOT --with-deps. That flag runs apt-get, and on this
      # runner apt spent 6-13 MINUTES per font package against
      # azure.archive.ubuntu.com — runs #136 and #137 both died there without
      # ever reaching the browser download (13m11s for a single 107 KB file).
      #
      # It is also unnecessary: the install log shows every library Playwright
      # actually requires (libnss3, libatk*, libcups2, libdrm, libgbm, ...)
      # already at "the newest version" on ubuntu-latest. The only NEW packages
      # --with-deps pulled were 9 font packages for CJK/Thai/Cyrillic glyphs,
      # which change pixel rendering, not the DOM text these specs assert on.
      #
      # If a future runner image ever does drop one of those libraries, Chromium
      # fails to launch with an explicit "missing shared library" error, which
      # is a far better failure than a 20-minute apt hang.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Run SEZ tests
        env:
          SEZ_USERNAME: ${{ secrets.SEZ_USERNAME }}
          SEZ_PASSWORD: ${{ secrets.SEZ_PASSWORD }}
          TYPE: ${{ inputs.type }}
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          # Branch on the test type. frontend is the default and keeps the
          # current behaviour; api/load are placeholders until those suites
          # exist (they fail loudly so a premature dispatch is obvious).
          #
          # SEZ's account is single-session: reusing one cached login from two
          # contexts at once knocks one of them back to the login page. The
          # sez-login -> sez-setup -> sez-columns -> sez-filter -> sez-create-zone
          # project chain (see playwright.config.ts) keeps everything serial,
          # so all five --project flags are always passed together, never
          # just "sez".
          case "${TYPE:-frontend}" in
            load)
              echo "Load (K6) tests are not configured yet for SEZ." >&2
              exit 1 ;;
            api)
              echo "API tests are not configured yet for SEZ." >&2
              exit 1 ;;
            *)
              if [ -n "$TEST_FILTER" ]; then
                # TEST_FILTER may hold several space-separated filters (multi-
                # select in the dashboard). Leave it unquoted so each becomes its
                # own positional arg; Playwright runs any test matching any.
                echo "Running selected tests: $TEST_FILTER"
                npx playwright test --project=sez-login --project=sez-setup --project=sez-columns --project=sez-filter --project=sez-create-zone $TEST_FILTER
              else
                npx playwright test --project=sez-login --project=sez-setup --project=sez-columns --project=sez-filter --project=sez-create-zone
              fi ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-sez
          path: playwright-tests/playwright-report/
          retention-days: 7

      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          DASHBOARD_USER: ${{ inputs.dashboard_user }}
          TYPE_RAW: ${{ inputs.type }}
          TEST_FILTER_RAW: ${{ inputs.test_filter }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping notification."
            exit 0
          fi
          case "$STATUS" in
            success) EMOJI="✅" ;;
            failure) EMOJI="❌" ;;
            cancelled) EMOJI="⚠️" ;;
            *) EMOJI="ℹ️" ;;
          esac
          if [ "$EVENT_NAME" = "schedule" ]; then
            TRIGGER_LINE="Scheduled (daily cron)"
          elif [ "${TRIGGERED_BY:-manual}" = "gitlab-deploy" ]; then
            TRIGGER_LINE="CI/CD (GitLab deploy)"
          elif [ -n "$DASHBOARD_USER" ]; then
            TRIGGER_LINE="Manual — ${DASHBOARD_USER}"
          else
            TRIGGER_LINE="Manual"
          fi
          TEST_TYPE="${TYPE_RAW:-frontend}"
          TEST_DISPLAY="${TEST_FILTER_RAW:-Full suite}"
          TEXT="$(printf '%s <b>SEZ Tests</b> #%s\nResult: <b>%s</b>\nType: <code>%s</code>\nTest: <code>%s</code>\nTriggered by: %s\nBranch: <code>%s</code>\n%s' \
            "$EMOJI" "$RUN_NUMBER" "$STATUS" "$TEST_TYPE" "$TEST_DISPLAY" "$TRIGGER_LINE" "$BRANCH" "$RUN_URL")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}"
